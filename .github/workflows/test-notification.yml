name: 测试 iPhone 推送

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 发送一条 Bark 测试通知
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python src/notify.py --test
