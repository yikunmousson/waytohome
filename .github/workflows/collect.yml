name: 采集路况

# 每小时 07/22/37/52 分（UTC）触发；分钟与北京时间一致。
# 调度可能延迟。生命周期截止后跳过业务任务并停用本工作流。

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# 上一次还没跑完就不要再起一个，避免并发写同一个文件
concurrency:
  group: collect-route
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查项目结束时间
        id: check
        run: python3 src/lifecycle.py
      - name: 到期停用定时工作流
        if: steps.check.outputs.active == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow disable collect.yml

  collect:
    needs: lifecycle
    if: needs.lifecycle.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        id: dependencies
        run: pip install -r requirements.txt

      - name: 检查密钥是否配置
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: |
          if [ -z "$AMAP_KEY" ]; then
            echo "::error::还没有配置 AMAP_KEY。请到仓库 Settings → Secrets and variables → Actions 添加名为 AMAP_KEY 的密钥。"
            exit 1
          fi

      - name: 采集（4 条固定走廊 + 2 条动态备选 × 去返）
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: python src/collect.py --if-due

      - name: 分析（当前走廊对比 / 场景历史 / 分段路况）
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python src/analyze.py

      - name: iPhone 路况提醒（可选 Bark）
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python src/notify.py

      - name: 更新路线缩略图（路线版本 / 途经点变化时才重新请求）
        continue-on-error: true
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: python src/thumb_map.py --if-stale

      - name: 提交数据
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          git config user.name "route-bot"
          git config user.email "route-bot@users.noreply.github.com"
          git add data web/data.json web/corridors-thumb-*
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 路况采样 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: 打包手机看板
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: collect
    # 私有仓库 + 免费账号不支持 GitHub Pages，硬跑会 404 失败，
    # 而本工作流 15 分钟一轮 —— 等于每 15 分钟刷一次红叉，把「采集到底成没成」
    # 这个信号淹掉。所以默认不跑（用仓库变量当开关，不开就不出现）。
    #
    # 想用手机看板：把仓库改成公开（或升级账号），然后
    # Settings → Secrets and variables → Actions → Variables 加 ENABLE_PAGES=true。
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
