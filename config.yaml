# ============================================================
# 国庆长途路线 · 监测配置
# 只需要改这个文件。改完提交，定时任务会自动按新配置跑。
# ============================================================

trip:
  name: "深圳西丽 → 衡阳"
  origin_name: "深圳 · 西丽地铁站"
  origin: "113.954325,22.580845"          # GCJ02（高德坐标系），格式 "经度,纬度"
  destination_name: "衡阳 · 市人民政府"
  destination: "112.571859,26.894350"     # GCJ02
  cartype: 0                # 0 普通汽车 / 1 纯电 / 2 插混
  plate_province: "粤"      # 用于限行规避；不确定可留空
  plate_number: ""
  # 改途经点或路线定义时递增。分析只使用同一版本的数据，避免新旧路线混算。
  route_version: 2

  # ----------------------------------------------------------
  # 候选走廊：1 条推荐 + 3 条备选，每个采集轮次全部算一遍。
  #
  # 关键设计 —— 为什么每条都要「钉途经点」：
  #   高德可能调整路径，今天走广连、明天可能被带去二广，
  #   每天的采样落在不同路段上，「哪几段比平常更堵」就无从比较。
  #   钉住后路线更稳定；仍会记录道路序列变化，出现明显改道时在看板告警。
  #
  # 途经点取自高速主线几何，不使用服务区 POI。服务区分方向，反向复用同一坐标
  # 可能触发下高速、掉头或重复经过隧道。去程和返程因此各有独立主线路点。
  #
  # 旧途经点的 2026-09-16 样本已隔离；新版里程与耗时由首次采集重新建立。
  # ----------------------------------------------------------
  corridors:
    - id: leguang
      name: "广连—许广通道（经从化 · 黎溪 · 连州）"
      short: "广连—许广"
      recommended: true
      note: "经广连北上后接许广，绕开韶关主城区；每轮仍以高德返回的实际道路序列为准。"
      waypoints: ["113.290390,23.940510"]     # 黎溪北以南的北向主线路点

    - id: xuguang
      name: "许广高速 G0421（清连段 · 经阳山 · 连州）"
      short: "许广 G0421"
      recommended: false
      note: "粤北西侧并行通道，广连方向拥堵时用于比较。"
      waypoints: ["112.719080,24.210040"]     # 阳山南以南的北向主线路点

    - id: jinggangao
      name: "京港澳 G4（经大广 G45 · 韶关曲江）"
      short: "京港澳 G4"
      recommended: false
      note: "2026 国庆宜章至朱亭南往北封闭，不能按 G4 直行北上；这里只比较高德当时给出的绕行方案，出发前必须复核。"
      waypoints: ["113.624210,24.637390"]     # 曲江以南的北向主线路点

    - id: erguang
      name: "二广 G55（西线 · 经怀集 · 连山）"
      short: "二广 G55"
      recommended: false
      note: "最西侧兜底方案，只在中部和东部通道明显拥堵时比较。"
      waypoints: ["112.255900,23.979360"]     # 怀集以东的西向主线路点

# 返程同样要监测 —— 返程高峰往往比去程更集中（10/6–10/7 下午到夜里）。
# 走廊集合与去程一致，去返方向使用各自主线路点。
return_trip:
  name: "衡阳 → 深圳西丽"
  origin_name: "衡阳 · 市人民政府"
  origin: "112.571859,26.894350"
  destination_name: "深圳 · 西丽地铁站"
  destination: "113.954325,22.580845"
  route_version: 2
  corridors:
    - id: leguang
      name: "许广—广连通道（经连州 · 黎溪 · 从化）"
      short: "许广—广连"
      recommended: true
      note: "使用南向主线路点，避免被北向停车区坐标带离主线。"
      waypoints: ["113.272250,23.983290"]     # 黎溪北以北的南向主线路点
    - id: xuguang
      name: "许广高速 G0421（清连段 · 经连州 · 阳山）"
      short: "许广 G0421"
      recommended: false
      note: "粤北西侧并行通道。"
      waypoints: ["112.719730,24.209270"]     # 阳山南附近的南向主线路点
    - id: jinggangao
      name: "京港澳 G4（经郴州 · 韶关曲江）"
      short: "京港澳 G4"
      recommended: false
      note: "东侧主通道，南向不受本次北向封闭方式直接限制，仍需留意动态管制。"
      waypoints: ["113.625170,24.637280"]     # 曲江附近的南向主线路点
    - id: erguang
      name: "二广 G55（西线 · 经永州 · 怀集）"
      short: "二广 G55"
      recommended: false
      note: "最西侧兜底方案。"
      waypoints: ["112.255220,23.979240"]     # 怀集附近的东向主线路点

collect:
  # 每条走廊都用同一个策略算，口径才能横向比。
  #   0 速度优先   4 躲避拥堵   2 距离优先   1 费用优先
  # 用 0 而不是 4：我们要看的是「这条路本来什么样」，
  # 开了躲避拥堵高德会替你绕，反而看不出真实堵况。
  strategy: 0
  timeout_seconds: 20
  retries: 3

  # 两档采集频率（分钟）。临近出发窗口自动切密集档。
  # 一轮 = 4 走廊 × 2 方向 = 8 次调用；15 分钟一档约 768 次/天。
  # 公开配额按月计算，最终以高德控制台显示为准。
  interval_normal_minutes: 30
  interval_dense_minutes: 15
  dense_start: "2026-09-26T00:00:00+08:00"
  dense_end: "2026-10-08T00:00:00+08:00"

holiday:
  # 2026 国庆高速免费：10/1 00:00 — 10/7 24:00（7 座及以下）
  # 判定以「驶离收费站」的时间为准 —— 所以 9/30 全天都能上路，0 点后出高速就免费
  free_start: "2026-10-01T00:00:00+08:00"
  free_end: "2026-10-08T00:00:00+08:00"     # 即 10/7 24:00
  holiday_days: ["2026-09-25", "2026-09-26", "2026-09-27", "2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04", "2026-10-05", "2026-10-06", "2026-10-07"]
  makeup_workdays: ["2026-09-20", "2026-10-10"]   # 补班，这两天是周日/周六但按工作日算
  # 中秋 9/25–27 放假但高速不免费
  outbound_candidates: ["2026-09-26", "2026-09-27", "2026-09-28", "2026-09-29", "2026-09-30", "2026-10-01", "2026-10-02"]
  # 返程要求是“在 10/4 前后 3 日抵达深圳”。这里多搜索前一天的出发时刻，
  # analyze.py 再按 return_arrival_candidates 过滤实际到达日。
  return_candidates: ["2026-09-30", "2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04", "2026-10-05", "2026-10-06", "2026-10-07"]
  return_arrival_candidates: ["2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04", "2026-10-05", "2026-10-06", "2026-10-07"]

analysis:
  segment_count: 20           # 沿线切成几段做对比
  baseline_window_days: 14    # 常态基线用最近多少天
  max_current_age_minutes: 45 # 超过该时间的成功结果不再叫“现在”，也不参加当前排名
  baseline_bucket_minutes: 30 # 基线按多少分钟一档聚合
  best_windows_per_corridor: 6  # 每条走廊收录几个最优出发窗口
  # 仿真数据（tests/backfill_demo.py）是否参与建模。
  # 必须保持 false —— 一旦混进基线，「比平常更堵」就变成自己跟自己比，结论全废。
  # 只有想看「看板有 14 天历史是什么样」时才临时打开。
  include_simulated: false

notifications:
  enabled: true              # 还须配置 BARK_URL；没有密钥时自动跳过
  active_start: "2026-09-25T00:00:00+08:00"
  active_end: "2026-10-08T00:00:00+08:00" # 不包含结束时刻
  eta_change_minutes: 30      # 推荐走廊比首次/上次已提醒采样增减多少分钟
  alternative_saving_minutes: 30 # 备选路线比推荐走廊少多少分钟才提醒
  cooldown_minutes: 60       # 同一方向的两条通知至少间隔一小时
  failure_rounds: 3          # 连续几轮所有路线都失败才提醒；恢复后再报一次

output:
  latest_file: "web/data.json"
